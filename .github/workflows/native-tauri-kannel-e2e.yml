name: Native Tauri Kannel E2E

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/native-tauri-kannel-e2e.yml'
      - 'Makefile'
      - 'browser/contracts/**'
      - 'browser/frontend/package.json'
      - 'browser/frontend/scripts/native-tauri-kannel-e2e.mjs'
      - 'browser/frontend/src/**'
      - 'browser/src-tauri/**'
      - 'docker-compose.yml'
      - 'docker/kannel/**'
      - 'engine-wasm/contracts/**'
      - 'engine-wasm/engine/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/native-tauri-kannel-e2e.sh'
      - 'transport-rust/**'
      - 'wml-server/**'
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-tauri-kannel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22.22.1'
  RUST_BROWSER_KEY: wavenav-browser-native-e2e
  TAURI_CLI_VERSION: '2.10.0'
  TAURI_DRIVER_VERSION: '2.0.6'
  KANNEL_IMAGE: wap-labs/kannel:ci-development
  WML_SERVER_IMAGE: wap-labs/wml-server:ci-development
  NATIVE_E2E_ARTIFACT_DIR: ${{ github.workspace }}/browser/frontend/test-results/native-tauri-kannel

jobs:
  native-tauri-kannel-e2e:
    name: Native Tauri UI through Kannel (pilot)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build cached Kannel development image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: docker/kannel
          target: development
          load: true
          tags: ${{ env.KANNEL_IMAGE }}
          cache-from: type=gha,scope=kannel-development
          cache-to: type=gha,mode=max,scope=kannel-development

      - name: Build cached WML origin image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: wml-server
          load: true
          tags: ${{ env.WML_SERVER_IMAGE }}
          cache-from: type=gha,scope=wml-server-development
          cache-to: type=gha,mode=max,scope=wml-server-development

      - name: Install Linux Tauri WebDriver dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config \
            webkit2gtk-driver \
            xvfb

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache native E2E Rust build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: ${{ env.RUST_BROWSER_KEY }}
          workspaces: |
            browser/src-tauri -> target
            engine-wasm/engine -> target
            transport-rust -> target

      - name: Cache pinned Tauri tools
        id: cache-tauri-tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/bin/tauri-driver
          key: ${{ runner.os }}-${{ runner.arch }}-tauri-tools-${{ env.TAURI_CLI_VERSION }}-${{ env.TAURI_DRIVER_VERSION }}

      - name: Install pinned Tauri CLI and WebDriver bridge on cache miss
        if: steps.cache-tauri-tools.outputs.cache-hit != 'true'
        run: |
          cargo install tauri-cli --version "${TAURI_CLI_VERSION}" --locked
          cargo install tauri-driver --version "${TAURI_DRIVER_VERSION}" --locked

      - name: Verify pinned Tauri tools
        run: |
          cargo tauri --version | grep -F "${TAURI_CLI_VERSION}"
          tauri-driver --version | grep -F "${TAURI_DRIVER_VERSION}"

      - name: Run native Tauri/Kannel UI pilot
        env:
          NATIVE_E2E_PREBUILT_IMAGES: '1'
        run: xvfb-run -a make smoke-native-tauri-kannel-ui

      - name: Upload native E2E diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-tauri-kannel-e2e-${{ github.run_attempt }}
          path: browser/frontend/test-results/native-tauri-kannel
          if-no-files-found: warn
          retention-days: 21

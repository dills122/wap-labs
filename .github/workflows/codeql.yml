name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '43 5 * * 2'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build_mode: none
          - language: rust
            build_mode: manual
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build_mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Install Linux system deps for Tauri
        if: ${{ matrix.language == 'rust' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
          sudo apt-get install -y libwebkit2gtk-4.1-dev || sudo apt-get install -y libwebkit2gtk-4.0-dev

      - name: Ensure Tauri frontendDist exists for compile-time config
        if: ${{ matrix.language == 'rust' }}
        run: |
          mkdir -p browser/frontend/dist
          test -f browser/frontend/dist/index.html || echo '<!doctype html><title>codeql-placeholder</title>' > browser/frontend/dist/index.html

      - name: Setup Rust toolchain
        if: ${{ matrix.language == 'rust' }}
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache Rust build artifacts
        if: ${{ matrix.language == 'rust' }}
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: wavenav-codeql-rust
          workspaces: |
            engine-wasm/engine -> target
            transport-rust -> target
            browser/src-tauri -> target

      - name: Build Rust crates for extraction
        if: ${{ matrix.language == 'rust' }}
        run: |
          cargo check --locked --manifest-path engine-wasm/engine/Cargo.toml --all-targets
          cargo check --locked --manifest-path transport-rust/Cargo.toml --all-targets
          cargo check --locked --manifest-path browser/src-tauri/Cargo.toml --all-targets

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4

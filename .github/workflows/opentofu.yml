name: OpenTofu Static Validation

on:
  pull_request:
    paths:
      - '.github/workflows/opentofu.yml'
      - '.github/workflows/opentofu-protected-apply.yml'
      - '.github/workflows/opentofu-protected-plan.yml'
      - '.github/dependabot.yml'
      - '.pre-commit-config.yaml'
      - '.gitignore'
      - 'Makefile'
      - 'infra/network-preview/**'
      - 'scripts/ci/*network-preview*.sh'
      - 'scripts/tests/network-preview-protected.test.mjs'
      - 'scripts/verify-lib.mjs'
      - 'scripts/tests/verify.test.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/opentofu.yml'
      - '.github/workflows/opentofu-protected-apply.yml'
      - '.github/workflows/opentofu-protected-plan.yml'
      - '.github/dependabot.yml'
      - '.pre-commit-config.yaml'
      - '.gitignore'
      - 'Makefile'
      - 'infra/network-preview/**'
      - 'scripts/ci/*network-preview*.sh'
      - 'scripts/tests/network-preview-protected.test.mjs'
      - 'scripts/verify-lib.mjs'
      - 'scripts/tests/verify.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

# This workflow is secret-free and backend-disabled, so replacing an older static run is safe.
# Future shared-state plan/apply workflows must use a different, non-cancelable concurrency group.
concurrency:
  group: opentofu-static-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: OpenTofu Static Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TF_IN_AUTOMATION: '1'
      TF_INPUT: '0'
      TF_VAR_admin_cidrs: '["192.0.2.1/32"]'
      TF_VAR_monitoring_alert_email: owner@example.com
      TF_VAR_project_name: offline-validation
      TF_VAR_region: nyc3
      TF_VAR_ssh_key_name: offline-validation
      TF_VAR_state_encryption_passphrase: offline-validation-only-not-for-state
      TF_VAR_wap_test_cidrs: '[]'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go for pinned actionlint
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache: false

      - name: Install pinned actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Validate OpenTofu workflow semantics
        run: scripts/ci/check-network-preview-workflows.sh

      - name: Setup pinned OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version_file: infra/network-preview/.opentofu-version
          tofu_wrapper: false

      - name: Check OpenTofu formatting
        run: tofu fmt -check -recursive infra/network-preview

      - name: Initialize without a remote backend
        working-directory: infra/network-preview/environments/preview
        run: tofu init -backend=false -lockfile=readonly -no-color

      - name: Validate staged preview infrastructure
        working-directory: infra/network-preview/environments/preview
        run: tofu validate -no-color

      - name: Verify multi-platform provider lock file
        working-directory: infra/network-preview/environments/preview
        run: |
          tofu providers lock \
            -platform=linux_amd64 \
            -platform=darwin_arm64 \
            -platform=darwin_amd64
          git diff --exit-code -- .terraform.lock.hcl

      - name: Validate network-preview CI scripts
        run: |
          sh -n scripts/ci/*network-preview*.sh
          shellcheck -x scripts/ci/*network-preview*.sh

      - name: Validate local plan helper syntax
        run: node --check scripts/network-preview-local-plan.mjs

      - name: Prove enforced offline plan encryption
        run: scripts/ci/check-network-preview-encrypted-plan.sh

      - name: Test protected workflow contracts
        run: node --test scripts/tests/network-preview-protected.test.mjs

name: Transport WAP Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/transport-wap-smoke.yml'
      - 'Makefile'
      - 'browser/contracts/**'
      - 'browser/src-tauri/**'
      - 'docker-compose.yml'
      - 'docker/kannel/**'
      - 'engine-wasm/contracts/**'
      - 'engine-wasm/engine/**'
      - 'gateway-kannel/**'
      - 'scripts/lib/run-and-tee.sh'
      - 'scripts/tests/transport-wap-smoke-status.sh'
      - 'scripts/transport-wap-smoke.sh'
      - 'transport-rust/**'
      - 'wml-server/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22.22.1'
  RUST_SHARED_KEY: wavenav-rust
  TRANSPORT_WAP_SMOKE_ARTIFACT_DIR: ${{ github.workspace }}/test-results/transport-wap-smoke
  WML_DTD_VERSION: '1.3'

jobs:
  transport-wap-smoke:
    name: Transport WAP Smoke (Kannel)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Start Kannel + WML stack
        run: docker compose up -d --build kannel wml-server

      - name: Install Linux Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build browser frontend
        run: pnpm --dir browser/frontend build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: ${{ env.RUST_SHARED_KEY }}
          workspaces: |
            transport-rust -> target

      - name: Run WAP smoke
        run: |
          ./scripts/tests/transport-wap-smoke-status.sh
          make smoke-transport-wap

      - name: Dump service logs on failure
        if: failure()
        run: |
          docker compose logs --tail=200 kannel wml-server || true

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: transport-wap-smoke-${{ github.run_attempt }}
          path: test-results/transport-wap-smoke
          if-no-files-found: warn
          retention-days: 14

      - name: Stop stack
        if: always()
        run: docker compose down

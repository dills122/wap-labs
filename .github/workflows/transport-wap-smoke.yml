name: Transport WAP Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/transport-wap-smoke.yml'
      - 'Makefile'
      - 'browser/contracts/**'
      - 'browser/src-tauri/**'
      - 'docker-compose.yml'
      - 'docker/kannel/**'
      - 'deploy/network-preview/**'
      - 'engine-wasm/contracts/**'
      - 'engine-wasm/engine/**'
      - 'gateway-kannel/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/lib/run-and-tee.sh'
      - 'scripts/tests/transport-wap-smoke-status.sh'
      - 'scripts/transport-wap-smoke.sh'
      - 'transport-rust/**'
      - 'wml-server/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transport-wap-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22.22.1'
  RUST_SHARED_KEY: wavenav-rust
  KANNEL_IMAGE: wap-labs/kannel:ci-development
  WML_SERVER_IMAGE: wap-labs/wml-server:ci-development
  WAP_GATEWAY_IMAGE: wap-labs/wap-gateway:production-ci
  WML_ORIGIN_IMAGE: wap-labs/wml-origin:production-ci
  TRANSPORT_WAP_SMOKE_ARTIFACT_DIR: ${{ github.workspace }}/test-results/transport-wap-smoke
  WML_DTD_VERSION: '1.3'

jobs:
  transport-wap-smoke:
    name: Transport WAP Smoke (Kannel)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build cached Kannel development image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: docker/kannel
          target: development
          load: true
          tags: ${{ env.KANNEL_IMAGE }}
          cache-from: type=gha,scope=kannel-development
          cache-to: type=gha,mode=max,scope=kannel-development

      - name: Build cached WML origin image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: wml-server
          load: true
          tags: |
            ${{ env.WML_SERVER_IMAGE }}
            ${{ env.WML_ORIGIN_IMAGE }}
          cache-from: type=gha,scope=wml-server-development
          cache-to: type=gha,mode=max,scope=wml-server-development

      - name: Build cached Kannel production image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: docker/kannel
          target: production
          load: true
          tags: ${{ env.WAP_GATEWAY_IMAGE }}
          cache-from: |
            type=gha,scope=kannel-development
            type=gha,scope=kannel-production
          cache-to: type=gha,mode=max,scope=kannel-production

      - name: Start Kannel + WML stack
        run: docker compose up -d --no-build kannel wml-server

      - name: Install Linux Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build browser frontend
        run: pnpm --dir browser/frontend build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: ${{ env.RUST_SHARED_KEY }}
          workspaces: |
            transport-rust -> target

      - name: Run WAP smoke
        run: |
          ./scripts/tests/transport-wap-smoke-status.sh
          make smoke-transport-wap

      - name: Stop development stack before production validation
        run: docker compose down

      - name: Start sealed production topology
        env:
          WAVES_SECRETS_DIR: ${{ runner.temp }}/waves-production-secrets
        run: |
          install -d -m 0700 "${WAVES_SECRETS_DIR}"
          printf '%064d\n' 0 >"${WAVES_SECRETS_DIR}/kannel-admin-password"
          printf '%064d\n' 1 >"${WAVES_SECRETS_DIR}/kannel-status-password"
          docker compose -f deploy/network-preview/compose.yaml up --detach --wait

      - name: Verify production WAP path and port publication
        env:
          WAVES_SECRETS_DIR: ${{ runner.temp }}/waves-production-secrets
          WML_ORIGIN_IMAGE: wap-labs/wml-origin:production-ci
          WAP_GATEWAY_IMAGE: wap-labs/wap-gateway:production-ci
          WAP_SMOKE_URL: wap://127.0.0.1/
          WAP_SMOKE_LOGIN_URL: wap://127.0.0.1/login
          WAP_SMOKE_REGISTER_URL: wap://127.0.0.1/register
          WAP_SMOKE_EXAMPLE_URL: wap://127.0.0.1/examples/index.wml
          WAP_SMOKE_PORTAL_EXAMPLE_URL: wap://127.0.0.1/examples/pocket-portal.wml
          WAP_SMOKE_PREFERENCES_EXAMPLE_URL: wap://127.0.0.1/examples/preferences.wml
          WAP_SMOKE_INTEROP_EXAMPLE_URL: wap://127.0.0.1/examples/interop-check.wml
          WAP_SMOKE_DENIED_URL: wap://127.0.0.1:9200/
        run: |
          test "$(docker compose -f deploy/network-preview/compose.yaml port --protocol udp wap-gateway 9200 | wc -l)" -eq 1
          if docker compose -f deploy/network-preview/compose.yaml port wap-gateway 13000; then
            echo "production topology unexpectedly published the Kannel admin port" >&2
            exit 1
          fi
          if docker compose -f deploy/network-preview/compose.yaml port wap-gateway 13002; then
            echo "production topology unexpectedly published the Kannel box port" >&2
            exit 1
          fi
          cd transport-rust
          cargo test --test kannel_smoke -- --ignored --skip kannel_wap_owned_origin_identity_smoke --test-threads=1
          cd ..
          docker compose -f deploy/network-preview/compose.yaml logs --no-color >"${RUNNER_TEMP}/waves-production.log"
          if grep -Eq '[0-9a-f]{64}' "${RUNNER_TEMP}/waves-production.log"; then
            echo "production logs contained a secret-shaped value" >&2
            exit 1
          fi

      - name: Dump service logs on failure
        if: failure()
        run: |
          docker compose logs --tail=200 kannel wml-server || true
          WAVES_SECRETS_DIR="${RUNNER_TEMP}/waves-production-secrets" \
          WML_ORIGIN_IMAGE=wap-labs/wml-origin:production-ci \
          WAP_GATEWAY_IMAGE=wap-labs/wap-gateway:production-ci \
            docker compose -f deploy/network-preview/compose.yaml logs --tail=200 || true

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: transport-wap-smoke-${{ github.run_attempt }}
          path: test-results/transport-wap-smoke
          if-no-files-found: warn
          retention-days: 14

      - name: Stop stack
        if: always()
        run: |
          docker compose down
          WAVES_SECRETS_DIR="${RUNNER_TEMP}/waves-production-secrets" \
          WML_ORIGIN_IMAGE=wap-labs/wml-origin:production-ci \
          WAP_GATEWAY_IMAGE=wap-labs/wap-gateway:production-ci \
            docker compose -f deploy/network-preview/compose.yaml down || true

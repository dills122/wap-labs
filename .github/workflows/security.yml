name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '27 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SYFT_VERSION: '1.44.0'
  GRYPE_VERSION: '0.112.0'

jobs:
  changes:
    name: Classify Security Paths
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      full_security: ${{ steps.scope.outputs.full_security }}
      network_preview_images: ${{ steps.filter.outputs.network_preview_images }}
    steps:
      - name: Determine security scope
        id: scope
        env:
          FULL_SECURITY: ${{ github.event_name != 'pull_request' }}
        run: echo "full_security=${FULL_SECURITY}" >> "${GITHUB_OUTPUT}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Detect image-affecting changes
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        with:
          filters: |
            network_preview_images:
              - ".github/workflows/security.yml"
              - "deploy/network-preview/**"
              - "docker/kannel/**"
              - "wml-server/**"

  dependency-review:
    name: Dependency Review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5

  rust-audit:
    name: Rust Advisory Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: wavenav-security-rust-audit
          workspaces: |
            engine-wasm/engine -> target
            transport-rust -> target
            browser/src-tauri -> target

      - name: Install cargo-audit
        uses: taiki-e/install-action@3a26e1142857d4ed43aacfecf39df466de8a685d # cargo-audit
        with:
          tool: cargo-audit

      - name: Audit engine runtime dependencies
        working-directory: engine-wasm/engine
        run: cargo audit

      - name: Audit transport dependencies
        working-directory: transport-rust
        run: cargo audit

      - name: Audit browser host dependencies
        working-directory: browser/src-tauri
        run: cargo audit

  node-audit:
    name: Node Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install pnpm workspace deps
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit workspace dependencies (high+)
        run: pnpm audit --audit-level high

  go-audit:
    name: Go Vulnerability Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache-dependency-path: wml-server/go.mod

      - name: Audit WML origin and Go standard library
        working-directory: wml-server
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  network-preview-images:
    name: Network Preview Image Audit
    needs: [changes]
    if: ${{ needs.changes.outputs.full_security == 'true' || needs.changes.outputs.network_preview_images == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go for pinned image tools
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache: false

      - name: Cache pinned image audit tools
        id: cache-image-audit-tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/go/bin/syft
            ~/go/bin/grype
          key: ${{ runner.os }}-${{ runner.arch }}-image-audit-tools-${{ env.SYFT_VERSION }}-${{ env.GRYPE_VERSION }}

      - name: Install pinned Syft and Grype on cache miss
        if: steps.cache-image-audit-tools.outputs.cache-hit != 'true'
        run: |
          go install "github.com/anchore/syft/cmd/syft@v${SYFT_VERSION}"
          go install "github.com/anchore/grype/cmd/grype@v${GRYPE_VERSION}"

      - name: Verify pinned image audit tools
        run: |
          go version -m "$(command -v syft)" | grep -F "github.com/anchore/syft v${SYFT_VERSION}"
          go version -m "$(command -v grype)" | grep -F "github.com/anchore/grype v${GRYPE_VERSION}"
          syft version >/dev/null
          grype version >/dev/null

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build cached WML origin production image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: wml-server
          load: true
          tags: wap-labs/wml-origin:security
          cache-from: type=gha,scope=wml-server-development
          cache-to: type=gha,mode=max,scope=wml-server-development

      - name: Build cached Kannel production image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: docker/kannel
          target: production
          load: true
          tags: wap-labs/wap-gateway:security
          cache-from: |
            type=gha,scope=kannel-development
            type=gha,scope=kannel-production
          cache-to: type=gha,mode=max,scope=kannel-production

      - name: Scan high and critical vulnerabilities
        run: |
          grype wap-labs/wml-origin:security --fail-on high
          grype wap-labs/wap-gateway:security --fail-on high

      - name: Generate CycloneDX SBOMs
        run: |
          install -d artifacts/network-preview
          syft wap-labs/wml-origin:security -o cyclonedx-json=artifacts/network-preview/wml-origin.sbom.cdx.json
          syft wap-labs/wap-gateway:security -o cyclonedx-json=artifacts/network-preview/wap-gateway.sbom.cdx.json

      - name: Upload image SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: network-preview-sboms-${{ github.run_attempt }}
          path: artifacts/network-preview
          if-no-files-found: error
          retention-days: 14

services:
  wml-server:
    image: "${WML_SERVER_IMAGE:-wap-labs/wml-server:development}"
    build:
      context: ./wml-server
      dockerfile: Dockerfile
    container_name: wml-server
    environment:
      WML_DTD_VERSION: "${WML_DTD_VERSION:-1.1}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - "3000"
      - "3001"
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:3001:3001"

  kannel:
    image: "${KANNEL_IMAGE:-wap-labs/kannel:development}"
    build:
      context: ./docker/kannel
      dockerfile: Dockerfile
      target: development
    container_name: wap-gateway
    depends_on:
      - wml-server
    ports:
      - "127.0.0.1:13000:13000"
      - "127.0.0.1:13002:13002"
      - "9200:9200/udp"
      - "9201:9201/udp"

group = core
admin-port = 13000
wapbox-port = 13002
# WARNING: these are known placeholder credentials for the root loopback-only development stack.
# docker-compose.yml binds both TCP ports to 127.0.0.1; replace these credentials and add
# deployment-specific access controls before using this config on any non-loopback interface.
admin-password = changeme
status-password = changeme
box-allow-ip = 127.0.0.1
wdp-interface-name = "*"
log-file = "/var/log/kannel/kannel.log"
log-level = 1

group = wapbox
bearerbox-host = localhost
# Route WSP requests coming to gateway port 13002 to the local WML app server.
device-home = "http://wml-server:3000/"

group = wap-url-map
name = local_gateway
url = "http://localhost:13002/*"
map-url = "http://wml-server:3000/*"

group = wap-url-map
name = wap_alias
url = "http://wap/*"
map-url = "http://wml-server:3000/*"

group = wap-url-map
name = host_gateway
url = "http://10.0.2.2/*"
map-url = "http://wml-server:3000/*"

# Logical multi-host lab profiles. Kannel rewrites the upstream Host header to the origin service,
# so the private path prefix carries the already-allowlisted profile across that boundary.
group = wap-url-map
name = lab_home
url = "http://home.wap.test/*"
map-url = "http://wml-server:3000/__lab/home/*"

group = wap-url-map
name = lab_forms
url = "http://forms.wap.test/*"
map-url = "http://wml-server:3000/__lab/forms/*"

group = wap-url-map
name = lab_interop
url = "http://interop.wap.test/*"
map-url = "http://wml-server:3000/__lab/interop/*"
